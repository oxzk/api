[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "1.0.0"
description = "通用工具 API (Python + FastAPI, 由 Cloudflare Workers 重构)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
