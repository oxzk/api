<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  <!-- API 连接符号 - 两个尖括号 < > 代表代码/接口 -->
  <g fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左尖括号 < -->
    <polyline points="13,10 7,16 13,22"/>
    <!-- 右尖括号 > -->
    <polyline points="19,10 25,16 19,22"/>
  </g>
  <!-- 中间斜线 / 代表路径 -->
  <line x1="18" y1="9" x2="14" y2="23" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>